<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protocol Explorer</title>
  <meta name="description" content="Compare how AI agent identity and authorization protocols identify agents, prove who they are, limit what they can do, and respond when something goes wrong.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    try { const t = localStorage.getItem("pe-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="visually-hidden" href="#view">Skip to content</a>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#/" aria-label="Protocol Explorer home">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
          <rect x="1" y="1" width="7" height="7" rx="1.5" fill="var(--g)"/><rect x="9.5" y="1" width="7" height="7" rx="1.5" fill="var(--g)"/><rect x="18" y="1" width="7" height="7" rx="1.5" fill="var(--y)"/>
          <rect x="1" y="9.5" width="7" height="7" rx="1.5" fill="var(--y)"/><rect x="9.5" y="9.5" width="7" height="7" rx="1.5" fill="var(--r)"/><rect x="18" y="9.5" width="7" height="7" rx="1.5" fill="var(--g)"/>
          <rect x="1" y="18" width="7" height="7" rx="1.5" fill="var(--r)"/><rect x="9.5" y="18" width="7" height="7" rx="1.5" fill="var(--g)"/><rect x="18" y="18" width="7" height="7" rx="1.5" fill="var(--r)"/>
        </svg>
        <span>Protocol Explorer</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-route="">Overview</a>
        <a href="#/explore" data-route="explore">Explore</a>
        <a href="#/rank" data-route="rank">Rank</a>
        <a href="#/landscape" data-route="landscape">Landscape</a>
        <a href="#/properties" data-route="properties">Properties</a>
        <a href="#/compare" data-route="compare">Compare</a>
        <a href="#/add" data-route="add">Add a report</a>
        <a href="#/about" data-route="about">About</a>
      </nav>
      <a class="icon-btn" href="#/search" id="search-btn" aria-label="Search the analyses" title="Search (press /)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </a>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch colour theme" title="Switch colour theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>
  <main id="view" tabindex="-1"><div class="wrap loading">Loading protocols</div></main>
  <footer class="site">
    <div class="wrap">
      <span>Analyses are produced with the <a href="https://drive.google.com/drive/folders/1QaKJ1ngJ2Dw5tPssELHjXJTAfV73cUz-?usp=drive_link" target="_blank" rel="noopener">protocol-analyzer skill</a> and checked against the specifications they cite.</span>
      <span id="foot-data"></span>
    </div>
  </footer>
  <div class="tray" id="tray" aria-live="polite"></div>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
